<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game - Guerra</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>PONG GAME</h1>
        <div class="scoreboard">
            <div class="score-section">
                <h2>Player</h2>
                <p id="playerScore">0</p>
            </div>
            <div class="score-section">
                <h2>Computer</h2>
                <p id="computerScore">0</p>
            </div>
        </div>
        
        <div class="game-container">
            <canvas id="gameCanvas" width="800" height="400"></canvas>
        </div>
        
        <div class="instructions">
            <h3>Controls:</h3>
            <p><strong>Mouse:</strong> Move your paddle up/down</p>
            <p><strong>Arrow Keys:</strong> Up/Down to move paddle</p>
            <p><strong>Space:</strong> Start/Restart Game</p>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
